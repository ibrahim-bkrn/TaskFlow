<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Inscription</title>
    <link rel="stylesheet" href="../public/css/style.css">
</head>
<body>
    <header>
        <h1>TaskFlow</h1>
        <nav>
            <a href="/accueil.html">Accueil</a>
            <a href="/projets.html">Projets</a>
            <a href="/taches.html">Tâches</a>
            <a class="active" href="/connexion.html">Connexion</a>
        </nav>
    </header>
    <main class="connexion">
        <h2>Inscription</h2>
        <form action="#" method="post" onsubmit="return validerFormulaireInscription()">
            
            <label for="nom">Nom</label>
            <input id="nom" name="nom" type="text" placeholder="Votre nom" required>

            <label for="prenom">Prénom</label>
            <input id="prenom" name="prenom" type="text" placeholder="Votre prénom" required>

            <label for="email">Adresse e-mail</label>
            <input id="email" name="email" type="email" placeholder="exemple@mail.com" required>

            <label for="motDePasse">Mot de passe</label>
            <input id="motDePasse" name="motDePasse" type="password" placeholder="Minimum 6 caractères" required>
            <small id="force-mdp"></small>

            <label for="confirmMotDePasse">Confirmer le mot de passe</label>
            <input id="confirmMotDePasse" name="confirmMotDePasse" type="password" placeholder="Confirmez votre mot de passe" required>

            <button type="submit">S'inscrire</button>
        </form>

        <p>Vous avez déjà un compte ? <a href="/connexion">Se connecter</a></p>
        <p><a href="accueil.html">Retour à l'accueil</a></p>
    </main>

    <script src="../public/js/utilisateur.js"></script>
</body>
</html>
