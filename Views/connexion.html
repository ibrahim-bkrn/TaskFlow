<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Connexion</title>
    <link rel="stylesheet" href="../public/css/style.css">
</head>
<body>
    <header>
        <h1>TaskFlow</h1>
        <nav>
            <a href="accueil.html">Accueil</a>
            <a href="projets.html">Projets</a>
            <a href="taches.html">Tâches</a>
            <a class="active" href="connexion.html">Connexion</a>
        </nav>
    </header>
    <main class="connexion">
        <h2>Connexion</h2>
        <form action="#" method="post" onsubmit="return validerFormulaireConnexion()">
            <label for="email">Adresse e-mail</label>
            <input id="email" name="email" type="email" placeholder="exemple@mail.com" required>

            <label for="motDePasse">Mot de passe</label>
            <input id="motDePasse" name="motDePasse" type="password" placeholder="Votre mot de passe" required>

            <button type="submit">Se connecter</button>
        </form>

        <p>Vous n'avez pas de compte ? <a href="inscription.html">S'inscrire</a></p>
        <p><a href="accueil.html">Retour à l'accueil</a></p>
    </main>

    <script src="../public/js/utilisateur.js"></script>
</body>
</html>
